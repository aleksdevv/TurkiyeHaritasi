<title>Türkiye İl Haritası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Düzen: tam ekran beyaz zemin üzerinde kırmızı il haritası. İl üzerine gelince yükselir ve parlar;
   bir süre beklenince ayrıntı kartı, ilin bulunduğu yarının karşı alt köşesine yerleşir. */
:root {
  --display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --body: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;

  --bg: #ffffff;
  --ink: #1d0e10;
  --muted: #7b5a5e;
  --red: #d71f2b;
  --red-hi: #f2273a;
  --red-deep: #8f1019;
  --seam: #ffffff;
  --card-line: #f1d5d8;
  --tint: #fdeced;
  --tint-line: #f4c3c7;
  --code: rgba(255, 255, 255, 0.72);
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.app { height: 100%; display: flex; flex-direction: column; padding-inline: clamp(16px, 2.5vw, 36px); padding-block: 20px; }

.stage { position: relative; flex: 1; min-height: 0; overflow: auto; background: var(--bg); }
.map { display: block; width: 100%; height: 100%; min-width: 780px; overflow: visible; }

.il {
  fill: var(--red);
  stroke: var(--seam);
  stroke-width: 1px;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
  cursor: pointer;
  transition: opacity .2s ease;
  outline: none;
}
.map.dim .il:not(.on) { opacity: .5; }
.il:focus-visible { stroke: var(--ink); stroke-width: 2px; }

.pop {
  fill: var(--red-hi);
  stroke: #ffffff;
  stroke-width: 1.6px;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
  pointer-events: none;
  transform-box: fill-box;
  transform-origin: center;
  transform: scale(1);
  transition: transform .26s cubic-bezier(.2, .9, .25, 1.25), opacity .2s ease;
  filter:
    drop-shadow(0 0 4px rgba(242, 39, 58, .9))
    drop-shadow(0 0 16px rgba(242, 39, 58, .65))
    drop-shadow(0 10px 12px rgba(80, 8, 14, .35));
}
.pop.lift { transform: scale(var(--s, 1.06)); }
.pop.out { opacity: 0; }
.pop.shake{animation:shake .6s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{
0%,100%{transform:scale(var(--s,1.06)) translate(0,0) rotate(0)}
10%{transform:scale(var(--s,1.06)) translate(-2.2px,.6px) rotate(-1.8deg)}
20%{transform:scale(var(--s,1.06)) translate(2.4px,-.6px) rotate(1.8deg)}
30%{transform:scale(var(--s,1.06)) translate(-2.6px,.4px) rotate(-1.4deg)}
40%{transform:scale(var(--s,1.06)) translate(2.6px,-.4px) rotate(1.4deg)}
50%{transform:scale(var(--s,1.06)) translate(-2px,.5px) rotate(-1deg)}
60%{transform:scale(var(--s,1.06)) translate(2px,-.5px) rotate(1deg)}
75%{transform:scale(var(--s,1.06)) translate(-1px,0) rotate(-.5deg)}
90%{transform:scale(var(--s,1.06)) translate(1px,0) rotate(.4deg)}}


.code {
  font: 500 8.5px var(--mono);
  fill: var(--code);
  text-anchor: middle;
  dominant-baseline: central;
  pointer-events: none;
  user-select: none;
}

.tip {
  position: absolute; left: 0; top: 0;
  padding: 4px 10px;
  border-radius: 8px;
  background: #ffffff;
  border: 1px solid var(--card-line);
  box-shadow: 0 6px 18px -6px rgba(80, 8, 14, .3);
  font: 600 12.5px var(--body);
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transition: opacity .12s;
  z-index: 2;
}
.tip.on { opacity: 1; }
.tip b { font-family: var(--mono); font-weight: 500; color: var(--red); margin-right: 7px; }

/* ---------- köşe kartı ---------- */
.card {
  position: fixed;
  right: 18px;
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  width: min(380px, calc(100vw - 32px));
  max-height: calc(100% - 36px);
  overflow: auto;
  border-radius: 18px;
  background: #ffffff;
  border: 1px solid var(--card-line);
  box-shadow: 0 26px 60px -14px rgba(100, 10, 18, .45), 0 0 0 1px rgba(255, 255, 255, .6) inset;
  z-index: 10;
  visibility: hidden;
  opacity: 0;
  transform: translateY(14px) scale(.97);
  transform-origin: bottom right;
  transition: opacity .2s ease, transform .26s cubic-bezier(.2, .9, .25, 1), visibility 0s linear .26s;
}
.card.left { right: auto; left: 18px; transform-origin: bottom left; }
.card.in { visibility: visible; opacity: 1; transform: none; transition: opacity .2s ease, transform .26s cubic-bezier(.2, .9, .25, 1), visibility 0s; }

.banner { position: relative; height: 150px; background: #fde8ea; }
.banner .art, .banner .art svg { display: block; width: 100%; height: 100%; }
.plate {
  position: absolute; left: 12px; top: 12px;
  min-width: 38px; height: 30px;
  display: grid; place-items: center;
  padding-inline: 9px;
  border-radius: 8px;
  background: #ffffff;
  color: var(--red);
  font: 500 15px var(--mono);
  box-shadow: 0 4px 10px -4px rgba(80, 8, 14, .4);
}
.cap {
  position: absolute; left: 12px; bottom: 10px; max-width: calc(100% - 24px);
  padding: 3px 10px; border-radius: 999px;
  background: rgba(255, 255, 255, .94); color: var(--red-deep);
  font: 600 12px var(--body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  box-shadow: 0 4px 10px -4px rgba(80, 8, 14, .4);
}
.x {
  position: absolute; right: 10px; top: 10px;
  width: 30px; height: 30px;
  display: grid; place-items: center;
  border: 0; border-radius: 50%;
  background: #ffffff;
  color: var(--red-deep);
  font: 400 21px/1 var(--body);
  cursor: pointer;
  box-shadow: 0 4px 10px -4px rgba(80, 8, 14, .4);
}
.x:hover { background: var(--tint); }
.x:focus-visible { outline: 2px solid var(--red-deep); outline-offset: 2px; }

.c-body { padding: 16px 18px 18px; }
.card h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 28px; line-height: 1.1; letter-spacing: -0.015em; text-wrap: balance; }
.c-region { margin: 6px 0 0; display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12.5px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); flex: none; }
.c-desc { margin: 12px 0 0; font-size: 14.5px; line-height: 1.55; }
.c-label { margin: 16px 0 8px; font: 600 11px var(--body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.c-known { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
.c-known li {
  padding: 4px 10px;
  border-radius: 999px;
  border: 1px solid var(--tint-line);
  background: var(--tint);
  color: var(--red-deep);
  font-size: 12.5px;
  font-weight: 500;
}


.c-facts{margin:14px 0 0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.c-facts div{padding:8px 10px;border-radius:10px;background:var(--tint);border:1px solid var(--tint-line)}
.c-facts dt{font:600 10px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.c-facts dd{margin:2px 0 0;font:600 13.5px var(--body);color:var(--red-deep)}
.c-hist{margin:8px 0 0;font-size:13.5px;line-height:1.55}
.c-fact{margin:16px 0 0;padding:10px 12px;border-left:3px solid var(--red);border-radius:0 10px 10px 0;background:var(--tint);font-size:13.5px;line-height:1.5}
.c-fact b{display:block;font:600 11px var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--red);margin-bottom:2px}
.c-links{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.c-links a{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border-radius:10px;border:1px solid var(--card-line);color:var(--ink);text-decoration:none;font-size:13px;font-weight:500}
.c-links a:hover,.c-links a:focus-visible{background:var(--tint);border-color:var(--red);color:var(--red-deep);outline:none}
.c-links a::after{content:"↗";color:var(--red);font-weight:600}
.c-hint{margin:14px 0 0;font-size:11.5px;color:var(--muted)}
@media (max-width: 640px) {
  .card, .card.left { left: 16px; right: 16px; width: auto; transform-origin: bottom center; }
}
@media (prefers-reduced-motion: reduce) {
  .pop, .card, .il, .tip { transition: none !important; }
  .pop.shake { animation: none !important; }
}
</style>
